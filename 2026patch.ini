; Rec Room 2026 patch configuration for client 20260323.14 only.
; Keep this file beside 2026patch.dll. Edit settings before launching the game.
; Changes take effect on the next launch.
; No server address or key is included. Use the details from your server operator.
; Missing/blank overrides keep the client's existing connection details.
; Lines starting with a semicolon are notes. Keep each setting on one line.

[Network]

; Discovery server origin, including http:// or https://.
; Example: https://ns.example.com or http://localhost:8080
; No trailing slash, path, username/password, query or fragment.
; The original discovery requests are redirected here; discovery supplies the
; other service URLs (API, authentication, notifications, images, etc.).
; Missing/blank keeps the client's discovery URL unchanged.
ServerUrl=

; Service domain, without a scheme, path or port. Example: example.com
; When ServerUrl is set too, its host must be this domain or a subdomain of it.
; Certificate compatibility checks and API cache fixes apply to this domain
; and its subdomains. It must cover the service hosts returned by discovery.
; Missing/blank disables domain-based overrides; client service URLs stay intact.
ServerDomain=

; Previous backend domain whose service URLs were cached by the client.
; Example: old.example.org rewrites api.old.example.org to api.example.com
; when ServerDomain=example.com. Service prefixes and ports are retained.
; Already-current URLs are left alone. Requires ServerDomain; blank disables it.
CachedServerDomain=

; Room/voice transport endpoint, as hostname:port or IPv4:port.
; Example: tachyon.example.com:7777 or 127.0.0.1:7777. Port range: 1-65535.
; Hostnames resolve to IPv4; this client does not support an IPv6 override.
; Blank keeps the endpoint supplied by matchmaking and the client's RSA key.
; A remote override requires VoiceKeyXml below; loopback can keep the client key.
TachyonHost=

; Transport server ID override. Set it only if your operator supplies an override.
; Blank preserves the server ID supplied by matchmaking (recommended).
; An explicit ID override requires TachyonHost to be set.
TachyonServerId=

; RSA public key as XML on one line. Never put a private key here.
; Format: <RSAKeyValue><Modulus>BASE64_MODULUS</Modulus><Exponent>AQAB</Exponent></RSAKeyValue>
; Obtain the public key from your server operator. Only Modulus and Exponent
; fields are allowed. The matching private key stays on the Tachyon server.
; Required for a remote TachyonHost override. Blank retains the client's key
; for loopback; leave blank when TachyonHost is also blank.
VoiceKeyXml=

; 1 = bypass the legacy certificate pin check for ServerDomain/subdomains only.
; Other hosts retain their original certificate policy. 0 = keep native checks.
; Default 1 provides compatibility with custom backend certificates.
DisableCertificatePinning=1

; 1 = accept images not signed by the retired official image service.
; This setting applies to all images checked by the patch.
; 0 = keep original image signature checks. Default: 1.
AllowUnsignedImages=1

[ScreenShare]

; Default: 0 = keep original client screen-sharing presets. Set 1-15 for a target FPS.
; Adaptive throttling and waiting for earlier frames can lower the delivered rate.
; Higher values require more upload bandwidth; resolution/quality are unchanged.
FramesPerSecond=0

[Logging]

; 0 = startup, connection state and failures only (default).
; 1 = extra HTTP/hook diagnostics for troubleshooting; turn off after testing.
; Log: 2026patch.log beside the DLL. Reset each launch, capped at 1 MiB.
; HTTP paths, queries, headers and image contents are not logged.
Verbose=0
