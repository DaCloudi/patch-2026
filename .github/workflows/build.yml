name: Build 2026 patch

on:
  push:
    branches: [main, 'style/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Native 2026 x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check C++ formatting
        shell: pwsh
        run: .\format.ps1 -Check
      - name: Build and package
        shell: pwsh
        run: .\build.cmd -Package
      - name: Upload drop-in ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Patch26Dist-x64
          if-no-files-found: error
          path: x64/Release/Patch26Dist.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download drop-in ZIP
        uses: actions/download-artifact@v4
        with:
          name: Patch26Dist-x64
          path: dist
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Patch26Dist.zip `
            --repo $env:GITHUB_REPOSITORY --generate-notes
